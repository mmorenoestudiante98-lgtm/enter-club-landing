  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

strong { color: var(--text-strong); }\n    .legal-content a { color: var(--brand); }\n    .legal-content a:hover { color: var(--brand-hover); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background: var(--brand); padding: 16px clamp(20px,5vw,64px); display: flex; align-items: center; justify-content: space-between; font-family: var(--font-sans);\">\n  <a href=\"index.html\" style=\"color: var(--text-on-brand); font-weight: var(--fw-bold); font-size: var(--fs-sm); text-decoration: none; display: flex; align-items: center; gap: 6px;\">← Volver<\u002Fa>\n  <span style=\"color: var(--text-on-brand); font-size: var(--fs-sm); font-weight: var(--fw-bold); letter-spacing: var(--ls-wider); text-transform: uppercase;\">TÉRMINOS Y CONDICIONES<\u002Fspan>\n<\u002Fdiv>\n<div class=\"legal-content\" style=\"max-width: 820px; margin: 0 auto; padding: clamp(48px,8vw,80px) clamp(20px,5vw,32px) clamp(64px,10vw,120px);\">\n<h1>Términos y Condiciones<\u002Fh1><p>Los presentes Términos y Condiciones (en adelante, \"T&amp;C\") regulan la contratación, a través del sitio web enterclub.net, de todos los servicios ofertados por ENTERCLUB (Delia Calzado), con domicilio en Lisieux Park, Dublin 18 y NIF 05445881X (en adelante, \"el Titular\").<\u002Fp><p>La contratación implica la aceptación expresa y sin reservas de estos T&amp;C, del Aviso Legal y de la Política de Privacidad vigentes en el momento de la compra.<\u002Fp><h2>1. Objeto<\u002Fh2><p>El objeto de los presentes T&amp;C es regular la prestación de los servicios ofrecidos por ENTERCLUB (en adelante, \"el Servicio\"), consistente en un servicio digital de acompañamiento con las siguientes características básicas:<\u002Fp><ul><li>Acceso a contenido formativo en formato evergreen (vídeos, guías, plantillas y recursos descargables) sobre desarrollo personal y profesional.<\u002Fli><li>Acceso a sesiones grupales en directo impartidas por el Titular, con la frecuencia y duración indicadas en la página de venta. El calendario, formato y frecuencia concreta de las sesiones podrán ajustarse y se comunicarán a los usuarios a través del Sitio o por correo electrónico.<\u002Fli><li>Acceso a la comunidad online del Servicio, alojada actualmente en la plataforma Skool.<\u002Fli><li>Soporte por correo electrónico en los canales establecidos.<\u002Fli><\u002Ful><p>El Titular podrá ajustar los contenidos, fechas, plataformas o formato concreto del Servicio con el fin de mejorar el servicio, garantizando en todo caso un valor equivalente al contratado.<\u002Fp><h2>2. Precio, IVA y forma de pago<\u002Fh2><ul><li><strong>Precio:<\u002Fstrong> el precio aplicable a cada servicio se indica en el Sitio en el momento de la contratación, sin perjuicio de los impuestos que resulten aplicables conforme a la normativa fiscal. El Titular se reserva el derecho a modificar el precio de la suscripción en el futuro. No obstante, los usuarios que ya dispongan de una suscripción activa mantendrán el precio contratado inicialmente mientras continúen suscritos de manera ininterrumpida.<\u002Fli><li><strong>Forma de pago:<\u002Fstrong> el pago se realizará mediante tarjeta bancaria u otros métodos de pago habilitados a través de la plataforma de pago utilizada por Skool y sus proveedores tecnológicos. La suscripción se renovará automáticamente al finalizar cada periodo de facturación mensual, salvo que el usuario cancele antes de la fecha de renovación.<\u002Fli><li><strong>Facturación:<\u002Fstrong> la documentación relativa a los pagos estará disponible a través de la plataforma utilizada para la contratación.<\u002Fli><li><strong>Impuestos:<\u002Fstrong> a los precios indicados se les añadirá el IVA o impuesto equivalente vigente en el país de residencia del usuario, conforme a la normativa fiscal aplicable. Para empresas con NIF-IVA válido de otro Estado miembro de la UE, se aplicará el régimen de inversión del sujeto pasivo cuando proceda.<\u002Fli><\u002Ful><h2>3. Proceso de contratación<\u002Fh2><ul><li>El usuario accede a la página de contratación desde el Sitio Web y facilita los datos necesarios para completar el proceso de compra.<\u002Fli><li>El usuario completa el pago mediante los métodos de pago habilitados a través de la plataforma Skool y sus proveedores tecnológicos.<\u002Fli><li>Una vez confirmado el pago, el usuario obtiene acceso a la comunidad y a los contenidos incluidos en su suscripción a través de su cuenta de usuario en Skool.<\u002Fli><li>La información relativa a la suscripción, pagos y documentación disponible podrá consultarse desde la cuenta de usuario o a través de los medios habilitados por la plataforma correspondiente.<\u002Fli><\u002Ful><p>El Titular conservará registro electrónico del contrato formalizado, al que el usuario podrá acceder solicitándolo por correo electrónico a delia.enter.club@gmail.com.<\u002Fp><p>La contratación se entenderá formalizada una vez que el usuario complete el proceso de compra y confirme expresamente su obligación de pago mediante el botón correspondiente mostrado durante el proceso de contratación.<\u002Fp><h2>4. Duración, renovación y cancelación<\u002Fh2><ul><li><strong>Duración:<\u002Fstrong> la suscripción tendrá carácter mensual y permanecerá activa mientras el usuario mantenga su membresía vigente y al corriente de pago.<\u002Fli><li><strong>Renovación:<\u002Fstrong> la suscripción se renovará automáticamente al finalizar cada periodo de facturación mensual mediante el método de pago facilitado por el usuario durante el proceso de contratación.<\u002Fli><li><strong>Cancelación:<\u002Fstrong> el usuario podrá solicitar la baja de su suscripción en cualquier momento. Una vez cancelada, conservará el acceso a la comunidad y a los contenidos incluidos hasta la finalización del periodo de facturación ya abonado. La cancelación de la suscripción no dará derecho al reembolso de las cantidades ya abonadas, salvo en los casos previstos legalmente o en las presentes Condiciones.<\u002Fli><li><strong>Mantenimiento del precio:<\u002Fstrong> los usuarios que mantengan una suscripción activa de forma ininterrumpida conservarán el precio vigente en el momento de su contratación. Las modificaciones de precio que el Titular pueda aplicar en el futuro afectarán únicamente a nuevas contrataciones. En caso de cancelación de la suscripción, cualquier nueva alta posterior se realizará al precio vigente en ese momento.<\u002Fli><li><strong>Suspensión o cancelación por parte del Titular:<\u002Fstrong> el Titular podrá suspender o cancelar el acceso a la comunidad de aquellos usuarios que incumplan las normas de convivencia, realicen conductas irrespetuosas hacia otros miembros o utilicen la comunidad de forma contraria a su finalidad. En estos casos, el Titular valorará las circunstancias concretas para determinar si procede o no el reembolso de las cantidades abonadas.<\u002Fli><\u002Ful><h2>5. Derecho de desistimiento y política de devoluciones<\u002Fh2><p>De conformidad con la Directiva 2011/83/UE sobre derechos de los consumidores, el consumidor dispone de un plazo de catorce (14) días naturales, desde la fecha de contratación, para desistir del contrato sin necesidad de justificación.<\u002Fp><p><strong>Excepciones:<\u002Fstrong> el derecho de desistimiento no será aplicable cuando:<\u002Fp><ul><li>El usuario haya solicitado expresamente la ejecución inmediata del servicio y este haya sido completamente ejecutado antes de la finalización del plazo de desistimiento.<\u002Fli><li>Se trate del suministro de contenido digital que no se preste en un soporte material, cuando la ejecución haya comenzado con el previo consentimiento expreso del consumidor y con el conocimiento por su parte de que pierde su derecho de desistimiento.<\u002Fli><\u002Ful><p>El usuario reconoce y acepta que el Servicio constituye un contenido digital y servicio de formación con acceso inmediato y, en el momento de la contratación, aceptará expresamente el inicio de la prestación durante el plazo de desistimiento, con la consecuente pérdida de dicho derecho a partir del primer acceso efectivo a los contenidos o a la comunidad.<\u002Fp><h2>6. Obligaciones del usuario<\u002Fh2><ul><li>Utilizar el Servicio de forma personal e intransferible. Las credenciales de acceso son individuales; no está permitido compartirlas, cederlas ni revenderlas.<\u002Fli><li>No reproducir, distribuir, comunicar públicamente ni transformar los contenidos del Servicio, ni grabar las sesiones en directo, salvo autorización expresa y por escrito del Titular.<\u002Fli><li>Mantener un comportamiento respetuoso en la comunidad online.<\u002Fli><li>Facilitar datos veraces y actualizados en el proceso de contratación.<\u002Fli><\u002Ful><p>El incumplimiento grave de estas obligaciones podrá dar lugar a la expulsión del Servicio sin derecho a reembolso, sin perjuicio de las acciones legales que correspondan.<\u002Fp><h2>7. Propiedad intelectual e industrial<\u002Fh2><p>Todos los contenidos del Servicio (vídeos, documentos, plantillas, guías, metodologías, marcas y signos distintivos) son titularidad exclusiva del Titular o de terceros que han autorizado su uso.<\u002Fp><p>El contrato únicamente otorga al usuario un derecho de uso personal, no exclusivo e intransferible, durante la vigencia del acceso.<\u002Fp><h2>8. Limitación de responsabilidad<\u002Fh2><p>El Servicio tiene finalidad formativa y de acompañamiento personal y profesional.<\u002Fp><p>El Titular no garantiza la obtención de resultados económicos, comerciales, laborales o personales concretos derivados de la aplicación de los contenidos, cuyo éxito depende en última instancia del esfuerzo, circunstancias y aplicación individual del usuario.<\u002Fp><p>En la máxima medida permitida por la ley, el Titular no responderá por daños indirectos, lucro cesante, pérdida de oportunidades o perjuicios derivados de la imposibilidad de acceso puntual a la plataforma por causas técnicas ajenas al Titular, fuerza mayor o incidencias de terceros proveedores.<\u002Fp><h2>9. Modificación del servicio<\u002Fh2><p>El Titular podrá introducir mejoras, ajustes de contenido o cambios de plataforma (por ejemplo, migración del área de comunidad a una plataforma distinta) siempre que se mantenga la sustancia de lo contratado.<\u002Fp><p>Se comunicarán con antelación razonable al usuario.<\u002Fp><h2>10. Protección de datos<\u002Fh2><p>El tratamiento de los datos personales facilitados por el usuario se rige por la Política de Privacidad y la Política de Cookies del Sitio.<\u002Fp><h2>11. Servicio de atención al cliente y resolución de conflictos<\u002Fh2><p>Cualquier consulta, reclamación o incidencia podrá dirigirse a delia.enter.club@gmail.com.<\u002Fp><p>El Titular se compromete a responder en un plazo máximo de diez (10) días hábiles.<\u002Fp><p>Conforme al Reglamento (UE) nº 524/2013, se informa al consumidor de la existencia de la plataforma europea de resolución de litigios en línea, disponible en ec.europa.eu/consumers/odr.<\u002Fp><h2>12. Ley aplicable y jurisdicción<\u002Fh2><p>Los presentes T&amp;C se rigen por la legislación irlandesa y por la normativa europea de consumidores aplicable.<\u002Fp><p>Para la resolución de cualquier controversia derivada de la interpretación o ejecución del contrato, las partes se someten a los Tribunales irlandeses con jurisdicción en el domicilio del Titular, salvo que la normativa aplicable en materia de consumidores y usuarios establezca otro fuero imperativo.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: var(--brand); padding: 20px clamp(20px,5vw,64px); text-align: center;\">\n  <p style=\"margin: 0; font-family: var(--font-sans); font-size: var(--fs-sm); color: var(--text-on-brand); opacity: 0.85;\">© 2026 Enter Club · enterclub.net<\u002Fp>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
