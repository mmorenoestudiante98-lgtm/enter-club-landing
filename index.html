document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

th: min(720px, calc(100% - 32px)); background: var(--bg-page); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px;\">\n      <p style=\"flex: 1 1 320px; margin: 0; font-size: var(--fs-sm); line-height: var(--lh-relaxed); color: var(--text-body);\">Usamos cookies técnicas y, solo si nos das permiso, analíticas para mejorar la web. Más info en nuestra <a href=\"cookies.html\" style=\"color: var(--brand); font-weight: var(--fw-bold);\">Política de cookies<\u002Fa>.<\u002Fp>\n      <sc-if value=\"{{ showCookieConfig }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex: 1 1 100%; display: flex; flex-direction: column; border-top: 1px solid var(--border-subtle);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border-subtle);\">\n            <div>\n              <p style=\"margin: 0; font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-strong);\">Técnicas (necesarias)<\u002Fp>\n              <p style=\"margin: 4px 0 0; font-size: var(--fs-sm); line-height: var(--lh-normal); color: var(--text-muted);\">Permiten que la web funcione y recuerdan tu elección de cookies.<\u002Fp>\n            <\u002Fdiv>\n            <span style=\"flex: none; font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--brand);\">Siempre activas<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0;\">\n            <div>\n              <p style=\"margin: 0; font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-strong);\">Analíticas<\u002Fp>\n              <p style=\"margin: 4px 0 0; font-size: var(--fs-sm); line-height: var(--lh-normal); color: var(--text-muted);\">Nos ayudan a medir de forma agregada cómo se usa la web (Google Analytics, MailerLite).<\u002Fp>\n            <\u002Fdiv>\n            <x-import component-from-global-scope=\"EnterClubDesignSystem_e97ee7.Switch\" hint-size=\"44px,24px\" checked=\"{{ analyticsDraft }}\" sc-camel-on-change=\"{{ setAnalyticsDraft }}\"><\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n        <button type=\"button\" class=\"ec-cta\" sc-camel-on-click=\"{{ toggleCookieConfig }}\" style=\"background: transparent; color: var(--brand); border: 1.5px solid var(--brand); border-radius: var(--radius-pill); height: 40px; padding: 0 18px; font-family: var(--font-sans); font-weight: 500; font-size: var(--fs-sm); cursor: pointer;\">{{ configButtonLabel }}<\u002Fbutton>\n        <button type=\"button\" class=\"ec-cta\" sc-camel-on-click=\"{{ rejectCookies }}\" style=\"background: var(--brand); color: var(--text-on-brand); border: 1.5px solid var(--brand); border-radius: var(--radius-pill); height: 40px; padding: 0 18px; font-family: var(--font-sans); font-weight: 500; font-size: var(--fs-sm); cursor: pointer;\">Rechazar todas<\u002Fbutton>\n        <button type=\"button\" class=\"ec-cta\" sc-camel-on-click=\"{{ acceptCookies }}\" style=\"background: var(--brand); color: var(--text-on-brand); border: 1.5px solid var(--brand); border-radius: var(--radius-pill); height: 40px; padding: 0 18px; font-family: var(--font-sans); font-weight: 500; font-size: var(--fs-sm); cursor: pointer;\">Aceptar todas<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- TOP BAR -->\n  <div style=\"position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px clamp(20px,5vw,64px); background: var(--brand);\">\n    <img src=\"c392d7ec-8387-4c3c-a889-4b63a2ecb1bf\" alt=\"Enter Club\" style=\"height: 44px; display: block;\">\n    <button type=\"button\" class=\"ec-cta\" sc-camel-on-click=\"{{ scrollToCta }}\" style=\"{{ headerCtaStyle }}\">Quiero mi plaza<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- SECTION 1: HERO -->\n  <section style=\"max-width: var(--container-max); margin: 0 auto; padding: clamp(48px,8vw,96px) clamp(20px,5vw,64px) clamp(56px,8vw,96px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px,100%),1fr)); gap: clamp(32px,5vw,64px); align-items: center;\">\n    <div>\n      \n      <h1 style=\"font-size: clamp(2.5rem, 5vw, var(--fs-display)); font-weight: var(--fw-bold); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); color: var(--text-strong); margin: 20px 0 0;\">Sabes lo que tienes que hacer.<br><span style=\"color: var(--brand);\">El problema es que no lo haces.<\u002Fspan><\u002Fh1>\n      <p style=\"font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--text-body); margin: 20px 0 0; max-width: 46ch;\">Las ideas solas no avanzan. Únete a un grupo que se compromete contigo y te empuja a dar un paso cada semana.<\u002Fp>\n\n      <div style=\"display: flex; flex-direction: column; gap: 14px; margin: 28px 0 0;\">\n        <sc-for list=\"{{ chipsWithState }}\" as=\"chip\" hint-placeholder-count=\"4\">\n          <div style=\"{{ chip.style }}\">\n            <span style=\"{{ chip.checkboxStyle }}\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fspan>\n            <span style=\"{{ chip.textStyle }}\">{{ chip.text }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin: 32px 0 0;\">\n        <button type=\"button\" class=\"ec-cta\" sc-camel-on-click=\"{{ scrollToCta }}\" style=\"{{ heroCtaStyle }}\">Quiero mi plaza<\u002Fbutton>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width: 100%; aspect-ratio: 1/1; border-radius: 24px; overflow: hidden; clip-path: inset(0 round 24px);\">\n      <image-slot id=\"hero-photo\" shape=\"rounded\" radius=\"24\" fit=\"contain\" placeholder=\"Foto real de Delia y Miguel, o mockup de un check-in en el móvil\" style=\"width: 100%; height: 100%; display: block;\" src=\"f15e942e-336f-4b32-9617-fa0671e1b1ed\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 2: EXCUSAS -->\n  <section style=\"padding: clamp(20px,3vw,32px) 0; background: var(--surface-inverse); overflow: hidden;\">\n    <h2 style=\"text-align: center; font-size: var(--fs-sm); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: var(--ls-wider); color: var(--text-on-brand); opacity: 0.85; margin: 0 0 14px; padding: 0 20px;\">¿TE SUENA?<\u002Fh2>\n    <div style=\"display: flex; width: max-content; gap: 40px; animation: ec-marquee 55s linear infinite;\">\n      <sc-for list=\"{{ excusasDoubled }}\" as=\"frase\" hint-placeholder-count=\"14\">\n        <span style=\"font-size: var(--fs-lg); font-weight: var(--fw-regular); color: var(--cream-100); opacity: 0.88; white-space: nowrap; font-style: italic;\">{{ frase }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    \n  <\u002Fsection>\n\n  <!-- SECTION 3: EL PROBLEMA -->\n  <section style=\"max-width: 820px; margin: 0 auto; padding: clamp(56px,8vw,96px) clamp(20px,5vw,32px); text-align: left;\">\n    <h2 style=\"font-size: clamp(1.75rem, 4vw, var(--fs-h1)); font-weight: var(--fw-bold); color: var(--brand); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); margin: 0 0 36px;\">Cumples con todos menos contigo<\u002Fh2>\n    <p style=\"font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--text-body); margin: 0 0 24px;\">Tienes la idea. Sabes lo que quieres construir. Has leído, has visto vídeos, quizá hasta has hecho algún curso. Sales con ganas… y a las dos semanas todo sigue igual.<\u002Fp>\n    <p style=\"font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--text-body); margin: 0 0 24px;\">Piénsalo: en el trabajo cumples los plazos. Si alguien espera algo de ti, lo haces. Pero cuando el único que espera eres tú, siempre aparece algo más urgente.<\u002Fp>\n    <p style=\"font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--text-body); margin: 0 0 36px;\">No es que seas vago ni que te falte disciplina. Es que tu proyecto no tiene a nadie esperando al otro lado.<\u002Fp>\n    <div style=\"width: 64px; height: 3px; background: var(--brand); margin: 0 0 28px; border-radius: 2px;\"><\u002Fdiv>\n    <p style=\"font-size: var(--fs-h3); font-weight: var(--fw-bold); color: var(--text-strong); letter-spacing: var(--ls-snug); margin: 0;\">Enter Club es ese otro lado.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 4: COMO FUNCIONA -->\n  <section id=\"como-funciona\" style=\"background: var(--brand); text-align: center;\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto; padding: clamp(56px,8vw,96px) clamp(20px,5vw,64px);\">\n      \n      <h2 style=\"font-size: clamp(1.75rem, 4vw, var(--fs-h1)); font-weight: var(--fw-bold); color: var(--text-on-brand); letter-spacing: var(--ls-tight); margin: 0 0 16px;\">Así funciona Enter Club.<\u002Fh2>\n      <p style=\"font-size: var(--fs-lg); color: var(--text-on-brand); opacity: 0.9; margin: 0 0 clamp(40px,6vw,72px);\">Es simple. Un grupo que se asegura de que lo hagas.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px,100%),1fr)); gap: clamp(32px,5vw,40px); text-align: left;\">\n        <sc-for list=\"{{ howItWorksSteps }}\" as=\"step\" hint-placeholder-count=\"4\">\n          <div>\n            <div style=\"font-size: clamp(2.5rem, 4vw, 3rem); font-weight: var(--fw-bold); color: var(--cream-100); letter-spacing: var(--ls-tight); line-height: 1; margin: 0 0 16px;\">{{ step.n }}<\u002Fdiv>\n            <h3 style=\"font-size: var(--fs-h4); font-weight: var(--fw-bold); color: var(--text-on-brand); margin: 0 0 10px;\">{{ step.title }}<\u002Fh3>\n            <p style=\"font-size: var(--fs-base); line-height: var(--lh-relaxed); color: var(--text-on-brand); opacity: 0.85; margin: 0;\">{{ step.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin: clamp(48px,7vw,80px) 0 0;\">\n        <button type=\"button\" class=\"ec-cta\" sc-camel-on-click=\"{{ scrollToCta }}\" style=\"{{ ctaLgStyle }}\">Quiero mi plaza<\u002Fbutton>\n        <p style=\"font-size: var(--fs-sm); color: var(--text-on-brand); opacity: 0.85; margin: 16px auto 0; max-width: 460px;\">Se empieza rellenando el cuestionario. <br>Si encajamos, agendamos tu sesión 1:1.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 5: PARA QUIEN ES -->\n  <section id=\"es-para-ti\" style=\"background: var(--bg-page); padding: clamp(56px,8vw,96px) clamp(20px,5vw,64px);\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto;\">\n      \n      <h2 style=\"font-size: clamp(2.25rem, 5vw, 3.25rem); font-weight: var(--fw-bold); color: var(--brand); letter-spacing: var(--ls-tight); margin: 0 0 20px; text-align: center;\">¿Es para ti?<\u002Fh2>\n      <p style=\"font-size: var(--fs-lg); color: var(--text-body); text-align: center; max-width: 640px; margin: 0 auto clamp(40px,6vw,64px);\">Enter Club no es para todo el mundo. Hay quien avanza solo. Nosotros necesitábamos a alguien esperando al otro lado, y por eso lo construimos.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px,100%),1fr)); gap: 24px; align-items: start;\">\n        <div style=\"background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;\">\n          <div style=\"background: var(--rust-50, #f4dfd0); padding: 18px 28px;\">\n            <h3 style=\"font-size: var(--fs-sm); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: var(--ls-wide); color: var(--brand); margin: 0;\">Es para ti si…<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; padding: 8px 28px 8px;\">\n            <sc-for list=\"{{ esParaTiItems }}\" as=\"item\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 12px; padding: 16px 0; border-bottom: {{ item.borderStyle }}; font-size: var(--fs-base); line-height: var(--lh-normal); color: var(--text-body);\">\n                <span style=\"flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--brand); color: var(--brand); font-size: 13px; font-weight: var(--fw-bold); display: flex; align-items: center; justify-content: center;\">✓<\u002Fspan>\n                <span>{{ item.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;\">\n          <div style=\"background: var(--surface-sunken); padding: 18px 28px;\">\n            <h3 style=\"font-size: var(--fs-sm); font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: var(--ls-wide); color: var(--text-muted); margin: 0;\">No es para ti si…<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; padding: 8px 28px 8px;\">\n            <sc-for list=\"{{ noEsParaTiItems }}\" as=\"item\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; gap: 12px; padding: 16px 0; border-bottom: {{ item.borderStyle }}; font-size: var(--fs-base); line-height: var(--lh-normal); color: var(--text-muted);\">\n                <span style=\"flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text-muted); color: var(--text-muted); font-size: 13px; font-weight: var(--fw-bold); display: flex; align-items: center; justify-content: center;\">✕<\u002Fspan>\n                <span>{{ item.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 6: TESTIMONIO -->\n  <section style=\"max-width: 920px; margin: 0 auto; padding: clamp(56px,8vw,96px) clamp(20px,5vw,32px);\">\n    <div style=\"background: linear-gradient(135deg, var(--surface-sunken), var(--bg-page-alt)); border-radius: var(--radius-lg); padding: clamp(24px,3.5vw,36px); display: flex; flex-wrap: wrap; gap: clamp(24px,3.5vw,40px); align-items: flex-end;\">\n        <div style=\"flex: 0 1 320px; min-width: 220px; max-width: 320px; margin: 0 auto;\">\n          <img src=\"d8b2b884-61cc-4002-8b2b-559e09998132\" alt=\"Jordi Cornudella Quer\" style=\"width: 100%; display: block; object-fit: contain;\">\n          <p style=\"font-size: var(--fs-base); font-weight: var(--fw-bold); color: var(--text-strong); margin: 12px 0 0;\">Jordi Cornudella Quer<\u002Fp>\n          <p style=\"font-size: var(--fs-sm); color: var(--text-muted); margin: 4px 0 0;\">CEO de Cadnion<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"align-self: center; flex: 999 1 300px; min-width: 0;\">\n          <p style=\"font-size: clamp(1.2rem, 2.4vw, var(--fs-h3)); font-weight: var(--fw-bold); color: var(--brand); line-height: var(--lh-snug); letter-spacing: var(--ls-snug); margin: 0 0 20px;\">\"Sin este compromiso, ahora mismo estaría avanzando mucho más despacio o seguiría despistado, haciendo tareas de relleno.\"<\u002Fp>\n          <p style=\"font-size: var(--fs-base); line-height: var(--lh-relaxed); color: var(--text-body); margin: 0;\">En Enter Club encuentras un grupo con el que abrirte fácilmente y que, ante todo, tiene una mentalidad de sumar y de ayudar. <br><br>Te mantiene enfocado en tus metas semana tras semana, sin desviarte. Aprendes a ponerte metas asequibles, sin pasarte, pero ambiciosas. <br><br>Y al final del mes miras atrás y te sientes orgulloso de lo que has conseguido.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 7: QUIENES SOMOS -->\n  <section id=\"cuestionario\" style=\"background: var(--brand);\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto; padding: clamp(56px,8vw,96px) clamp(20px,5vw,64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px,100%),1fr)); gap: clamp(32px,5vw,64px); align-items: center;\">\n      <div>\n        <h2 style=\"font-size: clamp(1.75rem, 4vw, var(--fs-h1)); font-weight: var(--fw-bold); color: var(--text-on-brand); letter-spacing: var(--ls-tight); margin: 0 0 24px;\">Hola, somos <br>Delia y Miguel<\u002Fh2>\n        <p style=\"font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--text-on-brand); opacity: 0.9; margin: 0 0 18px;\">Una pareja que durante años ha empezado mil ideas, mil proyectos, pero ninguno llegaba muy lejos. Arrancábamos con ganas y a las pocas semanas volvían los clásicos \"la semana que viene continúo\", \"me falta aprender más\", \"mañana empiezo, que hoy estoy cansado\"…<\u002Fp>\n        <p style=\"font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--text-on-brand); opacity: 0.9; margin: 0 0 18px;\">¿Qué ha cambiado? No ha sido más información ni más disciplina, sino la herramienta de productividad más infravalorada: otra persona con quien rendir cuentas.<\u002Fp>\n        <p style=\"font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--text-on-brand); opacity: 0.9; margin: 0;\">Hay muchas formaciones y libros detrás, pero tener a alguien esperando al otro lado con el que rendir cuentas es lo que nos ha hecho mantenernos en el camino en nuestros proyectos.<\u002Fp>\n      <\u002Fdiv>\n      <image-slot id=\"delia-miguel-photo\" shape=\"rounded\" radius=\"24\" placeholder=\"Foto real de Delia y Miguel, natural\" style=\"width: 100%; aspect-ratio: 4/3;\" src=\"0803d12b-d295-4fef-9a0d-63ffcb4331e7\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 9: FAQ -->\n  <section id=\"faq\" style=\"background: var(--bg-page-alt);\">\n  <div style=\"max-width: 1080px; margin: 0 auto; padding: clamp(40px,6vw,72px) clamp(20px,5vw,32px) clamp(56px,8vw,96px);\">\n    <h2 style=\"text-align: center; font-size: clamp(1.6rem, 3.6vw, var(--fs-h1)); font-weight: var(--fw-bold); color: var(--brand); letter-spacing: var(--ls-tight); margin: 0 0 clamp(32px,5vw,48px); text-wrap: balance;\">¿Tienes alguna pregunta?<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; border-top: 1px solid var(--border-subtle); max-width: 780px; margin: 0 auto;\">\n      <sc-for list=\"{{ faqWithState }}\" as=\"item\" hint-placeholder-count=\"5\">\n        <div style=\"border-bottom: 1px solid var(--border-subtle);\">\n          <button type=\"button\" sc-camel-on-click=\"{{ item.toggle }}\" style=\"{{ item.buttonStyle }}\">\n            <span>{{ item.question }}<\u002Fspan>\n            <span style=\"{{ item.iconStyle }}\">+<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ item.open }}\">\n            <p style=\"margin: 0; padding: 0 0 24px; font-size: var(--fs-base); line-height: var(--lh-relaxed); color: var(--text-body);\">{{ item.answer }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 10: LLAMADA FINAL -->\n  <section style=\"background: var(--bg-page-alt); padding: clamp(56px,8vw,96px) clamp(20px,5vw,32px);\">\n    <div style=\"max-width: 900px; margin: 0 auto; background: var(--brand); border-radius: var(--radius-lg); padding: clamp(48px,8vw,80px) clamp(24px,5vw,48px); text-align: center;\">\n      <h2 style=\"font-size: clamp(2rem, 4.5vw, var(--fs-h1)); font-weight: var(--fw-bold); color: var(--text-on-brand); letter-spacing: var(--ls-tight); margin: 0 0 20px;\">Sé la versión de ti que sí lo hace<\u002Fh2>\n      <p style=\"font-size: var(--fs-lg); color: var(--text-on-brand); opacity: 0.9; margin: 0 0 32px;\">Únete a un grupo de personas que avanzan cada <br>día hacia los objetivos que más les importan.<\u002Fp>\n      <button type=\"button\" class=\"ec-cta\" sc-camel-on-click=\"{{ scrollToCta }}\" style=\"{{ ctaLgStyle }}\">Quiero mi plaza<\u002Fbutton>\n      <p style=\"font-size: var(--fs-sm); color: var(--text-on-brand); opacity: 0.75; margin: 18px 0 0;\">Próximo grupo: octubre · Solo 6 plazas<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <div style=\"background: var(--brand); padding: clamp(48px,7vw,72px) clamp(20px,5vw,64px) 0;\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto; display: flex; flex-wrap: wrap; gap: clamp(32px,5vw,48px);\">\n      <div style=\"flex: 1.4 1 240px;\">\n        <img src=\"c392d7ec-8387-4c3c-a889-4b63a2ecb1bf\" alt=\"Enter Club\" style=\"height: 40px; display: block;\">\n        <p style=\"font-size: var(--fs-sm); line-height: var(--lh-relaxed); color: var(--text-on-brand); opacity: 0.8; margin: 16px 0 0; max-width: 260px;\">Un grupo pequeño que se asegura de que hagas lo que dices que vas a hacer.<\u002Fp>\n        <div style=\"display: flex; gap: 16px; margin: 18px 0 0; font-size: var(--fs-sm); color: var(--text-on-brand); opacity: 0.7;\">\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 150px;\">\n        <h4 style=\"font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-on-brand); margin: 0 0 16px;\">Enter Club<\u002Fh4>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: var(--fs-sm); color: var(--text-on-brand); opacity: 0.8;\">\n          <a href=\"#\" style=\"color: var(--text-on-brand);\">Inicio<\u002Fa>\n          <a href=\"#como-funciona\" style=\"color: var(--text-on-brand);\">Cómo funciona<\u002Fa>\n          <a href=\"#es-para-ti\" style=\"color: var(--text-on-brand);\">Es para ti<\u002Fa>\n          <a href=\"#faq\" style=\"color: var(--text-on-brand);\">Preguntas frecuentes<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 150px;\">\n        <h4 style=\"font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-on-brand); margin: 0 0 16px;\">Legal<\u002Fh4>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: var(--fs-sm); color: var(--text-on-brand); opacity: 0.8;\">\n          <a href=\"terminos.html\" style=\"color: var(--text-on-brand);\">Términos<\u002Fa>\n          <a href=\"aviso-legal.html\" style=\"color: var(--text-on-brand);\">Aviso legal<\u002Fa>\n          <a href=\"privacidad.html\" style=\"color: var(--text-on-brand);\">Política de privacidad<\u002Fa>\n          <a href=\"cookies.html\" style=\"color: var(--text-on-brand);\">Política de cookies<\u002Fa>\n          <button type=\"button\" sc-camel-on-click=\"{{ openCookieSettings }}\" style=\"background: none; border: none; padding: 0; text-align: left; font-family: var(--font-sans); font-size: var(--fs-sm); color: var(--text-on-brand); text-decoration: underline; cursor: pointer;\">Configurar cookies<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 150px;\">\n        <h4 style=\"font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-on-brand); margin: 0 0 16px;\">Contacto<\u002Fh4>\n        <p style=\"font-size: var(--fs-sm); line-height: var(--lh-relaxed); color: var(--text-on-brand); opacity: 0.8; margin: 0 0 14px;\">¿Dudas o sugerencias? Leemos todos los mensajes y respondemos a todos.<\u002Fp>\n        <a href=\"mailto:hola.enterclub@gmail.com\" style=\"display: inline-block; font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-on-brand); margin: 0 0 14px;\">hola.enterclub@gmail.com<\u002Fa>\n        <a href=\"https://www.instagram.com/enter__club/\" target=\"_blank\" rel=\"noopener\" aria-label=\"Instagram\" style=\"color: var(--text-on-brand); display: flex; align-items: center; width: fit-content;\">\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.2\" cy=\"6.8\" r=\"0.6\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"height: 1px; background: rgba(253,247,229,0.25); margin: clamp(40px,6vw,56px) 0 0;\"><\u002Fdiv>\n    <p style=\"max-width: var(--container-max); margin: 0 auto; padding: 24px 0; font-size: var(--fs-sm); color: var(--text-on-brand); opacity: 0.7;\">© 2026 Enter Club · Construyendo libertad, entre iguales.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst EXCUSAS = [\n  '\"Esta semana sí.\"',\n  '\"Cuando pase este mes, que ahora voy a tope.\"',\n  '\"Me falta un curso más y ya empiezo.\"',\n  '\"Primero tengo que tenerlo todo claro.\"',\n  '\"Mañana madrugo y lo hago.\"',\n  '\"Lo miro el domingo con calma.\"',\n  '\"Cuando tenga el logo, lanzo.\"',\n];\n\nconst CHIPS = [\n  'Publicar la web de mi proyecto',\n  'Grabar el primer vídeo',\n  'Hablar con 5 posibles clientes',\n  'Terminar la propuesta que llevo meses retocando',\n];\n\nconst GROUP_MEMBERS = ['Delia', 'Miguel', 'Ana', 'Carlos', 'Marta', 'Luis'];\n\nconst ES_PARA_TI = [\n  'Tienes un proyecto en marcha, pero no avanza como quieres.',\n  'Tienes una idea (o varias) y no terminas de dar el primer paso.',\n  'Cumples con los demás, pero tus propios plazos siempre se mueven.',\n  'Has probado apps de tareas y ninguna te ha durado más de dos semanas.',\n];\n\nconst NO_ES_PARA_TI = [\n  'Todavía no sabes qué quieres hacer. Este programa no es para ti ahora.',\n  'Buscas a alguien que te diga qué proyecto montar o cómo hacerlo.',\n  'No quieres que nadie te pregunte si has hecho lo que dijiste.',\n];\n\nconst HOW_IT_WORKS = [\n  { n: '1', title: 'Defines tu objetivo', text: 'Sesión 1:1 al empezar. Sales con un objetivo claro para las 4 semanas y tu primer paso decidido.' },\n  { n: '2', title: 'Te comprometes cada mañana', text: 'Te preguntamos qué vas a hacer hoy y nos lo dices. Dos minutos.' },\n  { n: '3', title: 'Rindes cuentas cada noche', text: 'Cuentas qué has hecho. El grupo lo lee y nosotros también.' },\n  { n: '4', title: 'Cierras la semana en grupo', text: 'Los viernes, 1 h 30 min. Repasáis la semana, veis qué os ha frenado y cada uno se compromete con la siguiente.' },\n];\n\nconst FAQ = [\n  { q: '¿Cuánto tiempo necesito al día?', a: 'El check-in te lleva 2 minutos por la mañana y 2 por la noche. Y los viernes, 1 h 30 min de sesión grupal.' },\n  { q: '¿Y si no me convence?', a: 'Puedes darte de baja cuando quieras. Mantienes el acceso hasta que termine el periodo que ya has pagado.' },\n  { q: '¿Es coaching?', a: 'No. No te vamos a decir qué hacer con tu proyecto. Te ayudamos a definir tus objetivos, tú decides tus pasos y el grupo y nosotros nos aseguramos de que los des.' },\n  { q: '¿A qué hora son las sesiones?', a: 'Los viernes por la tarde, hora de España. En el cuestionario nos dices qué franjas te van bien y acordamos una hora antes de empezar con las sesiones.' },\n  { q: '¿Y si un día no cumplo o un viernes no puedo ir?', a: 'Lo cuentas en el check-in y vemos juntos qué te ha frenado. Si un viernes no puedes ir, nos avisas y nos mandas por escrito tu resumen de la semana y tu compromiso para la siguiente.' },\n];\n\nclass Component extends DCLogic {\n  state = { faqOpen: -1, cookieChoice: null };\n\n  componentDidMount() {\n    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}\n    if (location.hash) history.replaceState(null, '', location.pathname + location.search);\n    window.scrollTo(0, 0);\n    let choice = null;\n    try { choice = localStorage.getItem('ec_cookie_consent_v2'); } catch (e) {}\n    this.setState({ cookieChoice: choice || 'pending' });\n  }\n\n  setCookieChoice(v) {\n    // v: 'accepted' (todas) | 'rejected' (solo técnicas) | 'custom:analytics' | 'custom:none'\n    try { localStorage.setItem('ec_cookie_consent_v2', v); } catch (e) {}\n    this.setState({ cookieChoice: v, cookieConfigOpen: false });\n  }\n\n  analyticsAllowed(choice) {\n    return choice === 'accepted' || choice === 'custom:analytics';\n  }\n\n  openCookieSettings() {\n    const current = this.state.cookieChoice;\n    this.setState({ cookieChoice: 'pending', cookieConfigOpen: true, analyticsDraft: this.analyticsAllowed(current) });\n  }\n\n  toggleFaq(i) {\n    this.setState((s) => ({ faqOpen: s.faqOpen === i ? -1 : i }));\n  }\n\n  scrollToCta() {\n    window.location.href = 'https://tally.so/r/68oG5O';\n  }\n\n  renderVals() {\n    const fadeByIdx = [1, 1, 0.55, 0.32];\n    const chipsWithState = CHIPS.map((text, i) => ({\n      text,\n      style: { display: 'flex', alignItems: 'center', gap: '12px', opacity: fadeByIdx[i] ?? 1 },\n      checkboxStyle: {\n        flex: 'none',\n        width: '22px',\n        height: '22px',\n        borderRadius: 'var(--radius-xs)',\n        background: 'var(--rust-50)',\n        border: '1.5px solid var(--brand)',\n        color: 'var(--brand)',\n        display: 'inline-flex',\n        alignItems: 'center',\n        justifyContent: 'center',\n      },\n      textStyle: { fontSize: 'var(--fs-base)', fontWeight: 500, color: 'var(--text-strong)' },\n    }));\n\n    const faqWithState = FAQ.map((item, i) => {\n      const open = this.state.faqOpen === i;\n      return {\n        question: item.q,\n        answer: item.a,\n        open,\n        toggle: () => this.toggleFaq(i),\n        buttonStyle: {\n          width: '100%',\n          display: 'flex',\n          alignItems: 'center',\n          justifyContent: 'space-between',\n          gap: '16px',\n          background: 'transparent',\n          border: 'none',\n          textAlign: 'left',\n          padding: '24px 0',\n          fontFamily: 'var(--font-sans)',\n          fontSize: 'var(--fs-lg)',\n          fontWeight: 700,\n          color: 'var(--brand)',\n          cursor: 'pointer',\n        },\n        iconStyle: {\n          flex: 'none',\n          width: '32px',\n          height: '32px',\n          borderRadius: '50%',\n          border: '1.5px solid var(--brand)',\n          color: 'var(--brand)',\n          fontSize: '16px',\n          fontWeight: 400,\n          display: 'flex',\n          alignItems: 'center',\n          justifyContent: 'center',\n          transform: open ? 'rotate(45deg)' : 'rotate(0deg)',\n          transition: 'transform var(--dur-base) var(--ease-out)',\n        },\n      };\n    });\n\n    return {\n      chipsWithState,\n      excusasDoubled: [...EXCUSAS, ...EXCUSAS],\n      groupMembers: GROUP_MEMBERS,\n      howItWorksSteps: HOW_IT_WORKS,\n      esParaTiItems: ES_PARA_TI.map((text, i) => ({ text, borderStyle: i === ES_PARA_TI.length - 1 ? 'none' : '1px solid var(--border-subtle)' })),\n      noEsParaTiItems: NO_ES_PARA_TI.map((text, i) => ({ text, borderStyle: i === NO_ES_PARA_TI.length - 1 ? 'none' : '1px solid var(--border-subtle)' })),\n      faqWithState,\n      scrollToCta: this.scrollToCta,\n      showCookieBanner: this.state.cookieChoice === 'pending',\n      acceptCookies: () => this.setCookieChoice('accepted'),\n      rejectCookies: () => this.setCookieChoice('rejected'),\n      showCookieConfig: !!this.state.cookieConfigOpen,\n      analyticsDraft: !!this.state.analyticsDraft,\n      setAnalyticsDraft: (next) => this.setState({ analyticsDraft: !!next }),\n      configButtonLabel: this.state.cookieConfigOpen ? 'Guardar selección' : 'Configurar',\n      toggleCookieConfig: () => {\n        if (this.state.cookieConfigOpen) this.setCookieChoice(this.state.analyticsDraft ? 'custom:analytics' : 'custom:none');\n        else this.setState({ cookieConfigOpen: true });\n      },\n      openCookieSettings: () => this.openCookieSettings(),\n      eyebrowStyle: { textTransform: 'uppercase', letterSpacing: 'var(--ls-wider)' },\n      creamCtaHoverStyle: { transform: 'translateY(-2px) scale(1.03)', boxShadow: 'var(--shadow-lg)' },\n      heroCtaHoverStyle: { transform: 'translateY(-2px) scale(1.03)', boxShadow: 'var(--shadow-lg)', filter: 'brightness(1.05)' },\n      headerCtaStyle: {\n        background: 'var(--cream-100)', color: 'var(--text-brand)', border: 'none', borderRadius: 'var(--radius-pill)',\n        height: '36px', padding: '0 16px', fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 'var(--fs-sm)',\n        letterSpacing: 'var(--ls-snug)', cursor: 'pointer', boxShadow: 'var(--shadow-xs)',\n        transition: 'transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out)',\n      },\n      ctaLgStyle: {\n        background: 'var(--cream-100)', color: 'var(--text-brand)', border: 'none', borderRadius: 'var(--radius-pill)',\n        height: '54px', padding: '0 32px', fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 'var(--fs-lg)',\n        letterSpacing: 'var(--ls-snug)', cursor: 'pointer', boxShadow: 'var(--shadow-md)',\n        transition: 'transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out)',\n      },\n      heroCtaStyle: {\n        background: 'var(--brand)', color: 'var(--text-on-brand)', border: 'none', borderRadius: 'var(--radius-pill)',\n        height: '54px', padding: '0 32px', fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 'var(--fs-lg)',\n        letterSpacing: 'var(--ls-snug)', cursor: 'pointer', boxShadow: 'var(--shadow-brand)',\n        transition: 'transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out)',\n      },\n      noEsParaTiCardStyle: { background: 'var(--surface-sunken)' },\n      ringStyle: { boxShadow: '0 0 0 2px var(--surface-inverse), 0 0 0 3px rgba(253,247,229,0.35)' },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
